<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icarus Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="assistant-shell" class="assistant-shell scene-fallback">
      <section id="bubble" class="assistant-bubble" aria-live="polite">
        <div class="bubble-head">
          <span id="bubble-kicker" class="bubble-kicker"
            >Personal Assistant</span
          >
          <button id="hide-btn" class="icon-btn no-drag" title="隐藏">×</button>
        </div>
        <h1 id="bubble-title">正在连接工作站</h1>
        <p id="bubble-body">等待 Icarus Web 服务响应。</p>
        <div id="bubble-actions" class="bubble-actions no-drag"></div>
      </section>

      <section
        id="assistant-chat"
        class="assistant-chat"
        aria-label="Assistant chat"
        aria-hidden="true"
      >
        <div id="chat-log" class="chat-log"></div>
        <div id="pending-files-preview" class="pending-files-preview">
          <span id="pending-files-content"></span>
          <button
            id="pending-files-close"
            type="button"
            title="取消附件"
            aria-label="取消附件"
          >
            ×
          </button>
        </div>
        <div id="file-drop-zone" class="file-drop-zone hidden">
          <span>Drop files here to upload</span>
        </div>
        <form id="chat-form" class="chat-form">
          <div class="chat-input-wrap">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="直接和助手说话"
            ></textarea>
            <div class="chat-input-actions">
              <button
                id="chat-send"
                class="chat-send-btn"
                type="submit"
                title="发送 (Enter)"
                aria-label="发送"
              >
                <svg
                  class="chat-send-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </form>
        <div id="chat-status" class="chat-status"></div>
      </section>

      <section
        id="assistant-mascot-trigger"
        class="assistant-mascot-wrap no-drag"
        aria-label="打开或收起聊天框"
        aria-controls="assistant-chat"
        aria-expanded="false"
        role="button"
        tabindex="0"
      >
        <div class="assistant-scene-stage" aria-hidden="true">
          <div id="assistant-scene" class="assistant-scene"></div>
          <img
            class="assistant-scene-fallback"
            src="../../assets/claw-icon.png"
            alt=""
          />
        </div>
      </section>
    </main>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
