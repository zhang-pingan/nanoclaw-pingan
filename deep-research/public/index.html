<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Research</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">DR</span>
      <span>Deep Research</span>
    </div>
    <button class="new-chat-btn" id="new-task-btn" type="button">新对话</button>
    <section class="recent">
      <h2>最近</h2>
      <div id="task-list" class="task-list"></div>
    </section>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <div></div>
      <div class="topbar-controls">
        <label class="model-picker">
          <span>Provider</span>
          <select id="provider-select"></select>
        </label>
        <label class="model-picker">
          <span>模型</span>
          <select id="model-select"></select>
        </label>
        <label class="model-picker report-type-picker" id="report-type-picker" hidden>
          <span>报告</span>
          <select id="report-type-select"></select>
        </label>
      </div>
    </header>

    <section class="thread" id="thread">
      <div class="empty-state" id="empty-state">
        <div class="empty-mark">🔭</div>
        <h1>深度研究</h1>
        <p>输入研究任务生成报告，或用 @agent 和行业分析师继续讨论。</p>
      </div>
    </section>

    <div class="reference-bar" id="reference-bar" hidden></div>
    <div class="agent-picker" id="agent-picker" role="listbox" aria-label="选择 Agent" hidden></div>
    <form class="composer" id="composer">
      <button class="agent-trigger-btn" id="agent-trigger-btn" type="button" aria-label="选择 Agent" aria-haspopup="listbox" aria-controls="agent-picker" aria-expanded="false" title="选择 Agent (@)">@</button>
      <textarea id="prompt-input" rows="1" placeholder="输入研究任务，或 @agent 追问"></textarea>
      <button class="send-btn" id="send-btn" type="submit" aria-label="发送">
        <span></span>
      </button>
    </form>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-panel">
      <header class="viewer-header">
        <div>
          <span>Report Bundle</span>
          <h2 id="viewer-title">Deep Research Report</h2>
        </div>
        <div class="viewer-actions">
          <a id="download-md" class="icon-link" href="#" download>MD</a>
          <a id="download-pdf" class="icon-link" href="#" target="_blank" rel="noreferrer">PDF</a>
          <button class="close-btn" id="close-viewer" type="button" aria-label="关闭">×</button>
        </div>
      </header>
      <article class="viewer-content" id="viewer-content"></article>
    </div>
  </div>

  <div class="context-menu" id="conversation-menu" hidden>
    <button type="button" data-delete-conversation>删除对话</button>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
