name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify toolchain identity
        shell: bash
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          expected_npm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(npm --version)" = "$expected_npm"
      - run: npm ci
      - name: Complete G0 conformance
        run: npm run test:g0
      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run
