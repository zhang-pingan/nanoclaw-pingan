name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify toolchain identity
        shell: bash
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          expected_npm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(npm --version)" = "$expected_npm"
      - run: npm ci
      - name: Current Runtime contracts and toolchain
        run: npm run test:g0
      - name: Current Schema and Store boundary
        run: npm run test:g1.1 && npm run test:g1.2
      - name: Current Compiler and sealed replay
        run: npm run test:g2 && npm run golden:current:replay:check
      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
